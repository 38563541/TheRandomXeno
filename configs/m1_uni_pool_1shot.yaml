# M1 — Unidirectional pool Hausdorff, 1-shot
# Baseline: Q->S only, no S->Q symmetry, pool-based aggregation.

matching: unidirectional
set_aggregation: pool
tau: 0.1

# Backbone
backbone: resnet18
trans_linear_out_dim: 1152

# Tuple configuration
temp_set: [2]
num_samples: 1

# Episode config
way: 5
shot: 1
query_per_class: 5

# Training
training_iterations: 100020
tasks_per_batch: 16

# Relation modules (disabled)
use_intra_relation: false
use_inter_relation: false
relation_level: none
