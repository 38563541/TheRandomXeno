# Stage 2 — HyRSM B3: HyRSM Inter only (tuple level, 5-shot)
# Class-specific cross-attention, no IntraRelation.
# Compares directly against stage2_b3_inter_only 5-shot (global inter only).

matching_method: bidirectional_hausdorff
bidirectional: true
tau: 0.1

# Backbone
backbone: resnet18
trans_linear_out_dim: 1152

# Tuple configuration
temp_set: [2]
num_samples: 1

# Episode config
way: 5
shot: 5
query_per_class: 5

# Training
training_iterations: 100020
tasks_per_batch: 16

# Relation modules (HyRSM inter only)
use_intra_relation: false
use_inter_relation: true
relation_level: tuple
inter_style: hyrsm
