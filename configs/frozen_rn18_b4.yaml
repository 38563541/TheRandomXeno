# 凍結軌道 — B4 intra+inter (true_hyrsm), RN18 frozen, 1-shot
# 從 configs/stage2_true_hyrsm_b4_tuple.yaml 複製，加 freeze_backbone: true
# 單變因：backbone 凍不凍。其他設定與 stage2_true_hyrsm_b4_tuple.yaml 完全相同。

matching: bidirectional
set_aggregation: pool
tau: 0.1

backbone: resnet18
trans_linear_out_dim: 1152

temp_set: [2]
num_samples: 1

way: 5
shot: 1
query_per_class: 5

training_iterations: 100020
tasks_per_batch: 16

use_intra_relation: true
use_inter_relation: true
relation_level: tuple
inter_style: true_hyrsm

# 凍結軌道
freeze_backbone: true
