# 1111：乾淨的 B3（inductive），用來組 B1/B2/B3/B4 2×2。這次只建檔、不訓練。
# 從 stage2_true_hyrsm_b4_tuple.yaml 複製，只把 use_intra_relation 改成 false。
# Stage 2 — True HyRSM B4: Intra + True HyRSM Inter (tuple level, 1-shot)
# Inter-relation follows the actual HyRSM paper (Wang et al., CVPR 2022):
#   global avg-pool → self-attention among all video descriptors → expand-concat-conv
# Compares directly against stage2_option_b (global MHA inter) and stage2_b2_intra_only.

matching: bidirectional      # 距離函數：雙向 mean-Hausdorff
set_aggregation: pool        # K 支 support 攤平成一個 tuple pool
tau: 0.1

backbone: resnet18
trans_linear_out_dim: 1152
temp_set: [2]
num_samples: 1

way: 5
shot: 1
query_per_class: 5

training_iterations: 100020
tasks_per_batch: 16

use_intra_relation: false
use_inter_relation: true
relation_level: tuple
inter_style: true_hyrsm
